# ── Agent Identity ─────────────────────────────────────────────────────────
agent_name: "SimpleAgent"
description: "A helpful AI assistant with built-in tools"

# ── Anthropic Settings ─────────────────────────────────────────────────────
# Leave api_key blank to use the ANTHROPIC_API_KEY environment variable (recommended)
api_key: ""
model: "claude-opus-4-6"       # or claude-sonnet-4-6 / claude-haiku-4-5-20251001
max_tokens: 1024

# ── Behaviour ──────────────────────────────────────────────────────────────
system_prompt: |
  You are a helpful AI assistant called SimpleAgent.
  You have access to the following tools:
    • get_current_time  – get today's date and time
    • calculate         – evaluate mathematical expressions
    • search_memory     – look up earlier parts of the conversation

  Always be concise, friendly, and accurate.
  Use tools whenever they would give a better answer than guessing.